<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TVAxKVA Live</title>

  <meta
    name="description"
    content="TVAxKVA Live - Gaming creators streaming live on YouTube and Kick."
  >

  <meta name="theme-color" content="#05070f">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= SPLASH ================= -->

  <div id="splash" class="splash">

    <div class="splash-orb splash-orb-red"></div>
    <div class="splash-orb splash-orb-green"></div>

    <div class="splash-content">

      <div class="splash-logo">
        <span class="red">TVA</span>
        <span class="x">×</span>
        <span class="green">KVA</span>
      </div>

      <div class="loader"></div>

      <p>Starting TVA × KVA Live<span class="dots"></span></p>

    </div>

  </div>


  <!-- ================= APP ================= -->

  <div id="app">

    <!-- HEADER -->
    <header class="header">

      <div class="header-inner">

        <a href="#home" class="brand">
          <span class="red">TVA</span>
          <span class="x">×</span>
          <span class="green">KVA</span>
        </a>

        <nav class="desktop-nav">

          <a href="#home" data-nav="home">
            Home
          </a>

          <a href="#youtube" data-nav="youtube">
            🔴 YouTube
          </a>

          <a href="#kick" data-nav="kick">
            🟢 Kick
          </a>

        </nav>

      </div>

    </header>


    <!-- ================= PAGE ================= -->

    <main id="page"></main>


    <!-- ================= MOBILE NAV ================= -->

    <nav class="mobile-nav">

      <a href="#home" data-mobile-nav="home">
        <span>🏠</span>
        <small>Home</small>
      </a>

      <a href="#youtube" data-mobile-nav="youtube">
        <span>🔴</span>
        <small>YouTube</small>
      </a>

      <a href="#kick" data-mobile-nav="kick">
        <span>🟢</span>
        <small>Kick</small>
      </a>

    </nav>


    <!-- ================= SCROLL TOP ================= -->

    <button id="scrollTop" class="scroll-top">
      ↑
    </button>

  </div>


  <script src="script.js"></script>

</body>
</html>
